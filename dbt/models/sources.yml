version: 2

sources:
  - name: external
    description: "Dış kaynaklı ham veriler: hava durumu (Open-Meteo) ve dizel fiyatları (FRED/EIA)."
    freshness:
      warn_after: {count: 30, period: day}
      error_after: {count: 90, period: day}
    tables:
      - name: weather
        description: "Mağaza bölge bazlı günlük hava durumu verileri."
        loaded_at_field: date_day
        freshness:
          warn_after: {count: 7, period: day}
          error_after: {count: 30, period: day}
      - name: diesel_prices
        description: "Bölgesel haftalık dizel yakıt fiyatları."
        loaded_at_field: week_date
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 60, period: day}
